name: Publish

# Builds the app and publishes it to GitHub Pages. Nothing needs installing on
# your own machine — GitHub runs the build.
#
# One-time setup:
#   1. Push this repo to GitHub.
#   2. Settings → Pages → Source: "GitHub Actions".
#   3. Push to main, or hit "Run workflow" on the Actions tab.
# Your URL will be https://<username>.github.io/<repo-name>/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
